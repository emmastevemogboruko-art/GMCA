<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Application Submitted | GMCA Membership</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Project CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/membership.css">

</head>

<body>

<section class="py-5 min-vh-100 d-flex align-items-center">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow-lg border-0">

                    <div class="card-body text-center p-5">

                        <div class="display-1 text-success mb-4">

                            <i class="bi bi-check-circle-fill"></i>

                        </div>

                        <h1 class="mb-3">

                            Congratulations!

                        </h1>

                        <p class="lead text-muted">

                            Your GMCA Membership Application has been submitted successfully.

                        </p>

                        <hr class="my-4">

                        <h5>

                            Application Reference

                        </h5>

                        <h2
                            id="applicationReference"
                            class="fw-bold text-success mb-4">

                            Loading...

                        </h2>

                        <div class="alert alert-success">

                            <strong>Confirmation Email</strong><br>

                            A confirmation email has been sent to your email address.

                        </div>

                        <div class="alert alert-info">

                            The GMCA Membership Team has been notified of your application.

                        </div>

                        <div class="mt-5">

                            <a
                                href="../index.html"
                                class="btn btn-success btn-lg">

                                <i class="bi bi-house-fill"></i>

                                Return to Home

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<script>

const application = JSON.parse(localStorage.getItem("gmcaApplication"));

if(application && application.meta){

    document.getElementById("applicationReference").textContent =
        application.meta.applicationId;

}else{

    document.getElementById("applicationReference").textContent =
        "Unavailable";

}

</script>

</body>

</html>
