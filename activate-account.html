<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Activate Account | Gospel Music Community Africa
    </title>

    <link
        rel="stylesheet"
        href="assets/css/main.css"
    >

</head>

<body>

    <div class="container mt-5">

        <div
            class="card shadow-sm mx-auto"
            style="max-width:500px;"
        >

            <div class="card-body p-4">

                <h2 class="text-center mb-4">

                    Activate Your Account

                </h2>

                <p class="text-center">

                    Create your password to activate your
                    Gospel Music Community Africa account.

                </p>

                <div
                    id="message"
                    class="mb-3"
                ></div>

                <form id="activationForm">

                    <div class="mb-3">

                        <label
                            class="form-label"
                        >

                            New Password

                        </label>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-4">

                        <label
                            class="form-label"
                        >

                            Confirm Password

                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-control"
                            required
                        >

                    </div>

                    <button
                        class="btn btn-success w-100"
                        type="submit"
                    >

                        Activate Account

                    </button>

                </form>

            </div>

        </div>

    </div>

    <script src="assets/js/pages/activate-account.js"></script>

</body>

</html>
